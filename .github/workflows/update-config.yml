name: Update Site Config
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write customized config
        run: |
          echo "dGVzdA==" | base64 -d > _config.yml
      - name: Commit and push
        run: |
          git config user.name "RamControllerFilter"
          git config user.email "RamControllerFilter@users.noreply.github.com"
          git add _config.yml
          git commit -m "Restore _config.yml"
          git push
