name: Fix Config URL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix url scheme in config
        run: |
          DOMAIN="ramcontrollerfilter.github.io"
          sed -i "s|^url .*|url                      : https://${DOMAIN}|" _config.yml
      - name: Commit and push
        run: |
          git config user.name "RamControllerFilter"
          git config user.email "RamControllerFilter@users.noreply.github.com"
          git add _config.yml
          git commit -m "Fix url scheme in _config.yml"
          git push
